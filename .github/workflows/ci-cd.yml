name: Pipeline CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # continuous integration
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t pipeline_proj:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name pipeline-test \
            -p 127.0.0.1:8080:8080 \
            pipeline_proj:ci

      - name: Smoke test container
        run: |
          curl -fsS --retry 10 \
            --retry-connrefused --retry-delay 1 \
            http://localhost:8080/health

          # curl -fsS http://localhost:8080/
          # curl -fsS http://localhost:8080/about

          # test "$(curl -fsS http://localhost:8080/version)" = "$GITHUB_SHA"

      - name: Clean up container
        if: always()
        run: |
          docker logs pipeline-test || true
          docker rm -f pipeline-test || true

      - name: Save Docker image
        if: github.ref == 'refs/heads/main'
        run: docker save pipeline_proj:ci -o image.tar

      - name: Upload image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 7
          overwrite: true

  # continuous delivery/deployment
  cd:
    name: Publish and deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and publish Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag pipeline_proj:ci "$IMAGE:$GITHUB_SHA"

          docker push "$IMAGE:$GITHUB_SHA"

          echo "IMAGE_REF=$IMAGE:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Deploy application
        if: vars.APP_URL != ''
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS --max-time 30 --get \
            --data-urlencode "imgURL=$IMAGE_REF" \
            "$DEPLOY_HOOK" > /dev/null

      - name: Verify deployment
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in {1..60}; do

            VERSION=$(curl -fsS --max-time 10 "$APP_URL/version" || true)

            if [ "$VERSION" = "$GITHUB_SHA" ]; then
              curl -fsS --max-time 10 "$APP_URL/health"
              curl -fsS --max-time 10 "$APP_URL/"
              curl -fsS --max-time 10 "$APP_URL/about"

              echo "Deployment successful"
              exit 0
            fi

            sleep 10
          done

          echo "Deployment verification failed"
          exit 1